<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Location Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css?v=4">
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="js/app.js?v=6"></script>
  </head>
  <body>
    <main>
      <h1>My Location Map</h1>
      <p id="status" role="status" aria-live="polite">Requesting your location…</p>
      <p id="tracking-status-line">Tracking status: <span id="tracking-status">Waiting for location...</span></p>
      <div id="map" aria-label="Street map"></div>
      <section class="location-info" aria-label="Location information">
        <p>Latitude: <span id="latitude">—</span></p>
        <p>Longitude: <span id="longitude">—</span></p>
        <p>Accuracy: <span id="accuracy">—</span></p>
        <p>Location quality: <span id="location-quality">—</span></p>
      </section>
    </main>
  </body>
</html>
